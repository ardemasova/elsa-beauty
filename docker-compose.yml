version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ELSA_BEAUTY
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ELSA_BEAUTY
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: ELSA_BEAUTY_backend
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ELSA_BEAUTY
      JWT_SECRET: 1234
    ports:
      - "3000:3000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: ELSA_BEAUTY_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data: