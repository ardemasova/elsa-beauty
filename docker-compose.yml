# Secrets are read from ./.env next to this file (see .env.example), never
# written here.
#
#   docker compose up -d --build
#   docker compose run --rm backend npm run migrate    # after every update

services:
  db:
    image: postgres:15
    container_name: ELSA_BEAUTY
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-ELSA_BEAUTY}
    # Only reachable from this server (e.g. for an SSH tunnel), never from the internet.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      retries: 5

  backend:
    build: ./backend
    container_name: ELSA_BEAUTY_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ELSA_BEAUTY_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
